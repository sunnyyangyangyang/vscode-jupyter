# Every commit to main triggers a build and creates a GitHub Release
name: Build & Release Vscodium Jupyter

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --include=dev

      - name: TypeScript compile
        run: npx tsc -p ./

      - name: esbuild (production bundle)
        run: npx tsx build/esbuild/build.ts --production

      - name: Package vsix and create release
        id: package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BUILD_SUFFIX=$(date +'%y%m%d')
          SHORT_SHA=$(git rev-parse --short HEAD)
          FULL_VERSION="${VERSION}-b${BUILD_SUFFIX}"
          VSIX_NAME="vscodium-jupyter-${FULL_VERSION}.vsix"
          TAG_NAME="build-${BUILD_SUFFIX}-${SHORT_SHA}"

          npx vsce package -o "$VSIX_NAME"

          echo "version=$FULL_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "vsix_name=$VSIX_NAME" >> "$GITHUB_OUTPUT"
          echo "::notice::Building vscodium-jupyter $FULL_VERSION -> $VSIX_NAME (tag: $TAG_NAME)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag_name }}
          name: "Vscodium Jupyter ${{ steps.package.outputs.version }}"
          target_commitish: main
          generate_release_notes: true
          files: ${{ steps.package.outputs.vsix_name }}
